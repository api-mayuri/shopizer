
authToken.header=Authorization

#JWT authentication configuration for sm-shop
jwt.header=Authorization
# Base64 encoded HMAC key, at least 64 bytes (HS512). Generate one with: openssl rand -base64 64
# Empty: a random key is generated at startup (tokens do not survive a restart, single instance only).
jwt.secret=${SHOPIZER_JWT_SECRET:}
jwt.expiration= 604800


