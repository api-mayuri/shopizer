##
## PostgreSQL (spring profile "postgresql")
## Every value can be overridden with an environment variable or a JVM system property.
##
db.jdbcUrl=${SHOPIZER_DB_URL:jdbc:postgresql://localhost:5432/SALESMANAGER}
db.user=${SHOPIZER_DB_USER:shopizer}
db.password=${SHOPIZER_DB_PASSWORD:password}
db.driverClass=org.postgresql.Driver
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

db.show.sql=false
db.preferredTestQuery=SELECT 1
# unquoted identifiers are folded to lower case by PostgreSQL
db.schema=salesmanager

# the schema is managed by Flyway (classpath:db/migration/postgresql), Hibernate only validates it
hibernate.hbm2ddl.auto=${SHOPIZER_DDL_AUTO:validate}

##
## connection pool
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=${SHOPIZER_DB_POOL_SIZE:10}
