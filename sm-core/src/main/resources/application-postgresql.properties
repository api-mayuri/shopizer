# Spring profile "postgresql": database settings are in profiles/postgresql/database.properties.
# Schema migrations are managed by Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.schemas=salesmanager
spring.flyway.default-schema=salesmanager
spring.flyway.create-schemas=true
# an existing schema without Flyway history (e.g. data migrated from MySQL) is baselined at version 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
